name: "Build Main Image"

# Builds this fork's image and, on every merge to main, pushes it to
# ghcr.io/halleshubham/sociobird-app as sha-<short> and main - but only after a
# boot check: the candidate image is started against throwaway Postgres, Redis
# and Temporal containers and must prove its orchestrator (the worker that
# publishes scheduled posts) starts and is polling the "main" task queue.
# Production (Coolify "postiz-v2") pins an explicit tag: to release, point it
# at the sha-<short> tag published here. The manual counterpart for building
# other branches is build-qat-image.yml.
#
# workflow_dispatch runs the build and the boot check without pushing, so the
# pipeline itself can be tested from any branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-main-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-check-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/halleshubham/sociobird-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t candidate:ci \
            --build-arg NEXT_PUBLIC_VERSION=${{ steps.vars.outputs.tag }} \
            --load .

      # Starts the orchestrator exactly the way the image does (same node
      # command as `pnpm start` in apps/orchestrator) with real dependencies,
      # then requires, within 3 minutes:
      #   1. the process reaches "Starting Nest application"
      #   2. the worker for the "main" task queue reports RUNNING
      #   3. the health endpoint answers 200
      #   4. Temporal itself sees pollers on the "main" task queue
      - name: Boot check (orchestrator must start and poll Temporal)
        run: |
          set -u
          docker network create ci
          docker run -d --name pg --network ci \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            postgres:17-alpine
          docker run -d --name redis --network ci redis:7.2
          docker run -d --name temporal --network ci \
            temporalio/temporal:latest server start-dev --ip 0.0.0.0

          fail() {
            echo "::error::Boot check failed: $1"
            echo "----- orchestrator logs -----"; docker logs app 2>&1 | tail -n 150 || true
            echo "----- temporal logs -----";     docker logs temporal 2>&1 | tail -n 40 || true
            exit 1
          }

          for i in $(seq 1 60); do
            docker exec pg pg_isready -U ci -d ci >/dev/null 2>&1 \
              && docker exec redis redis-cli ping 2>/dev/null | grep -q PONG \
              && docker exec temporal temporal operator cluster health 2>/dev/null | grep -q SERVING \
              && break
            [ "$i" = 60 ] && { echo "::error::throwaway dependencies did not become ready"; exit 1; }
            sleep 2
          done

          docker run -d --name app --network ci \
            -e DATABASE_URL=postgresql://ci:ci@pg:5432/ci \
            -e REDIS_URL=redis://redis:6379 \
            -e TEMPORAL_ADDRESS=temporal:7233 \
            -e JWT_SECRET=ci-boot-check-secret -e FRONTEND_URL=http://localhost:4200 \
            -e IS_GENERAL=true -e ORCHESTRATOR_PORT=3002 \
            candidate:ci sh -c '
              pnpm run prisma-db-push &&
              cd apps/orchestrator &&
              exec node --experimental-require-module ./dist/apps/orchestrator/src/main.js'

          started=0; running=0; healthy=0
          for i in $(seq 1 90); do
            sleep 2
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || fail "orchestrator process exited"
            logs="$(docker logs app 2>&1)"
            echo "$logs" | grep -q "Starting Nest application" && started=1
            echo "$logs" | grep -Eq "Worker state changed.*taskQueue: 'main'.*RUNNING" && running=1
            if [ "$running" = 1 ] && docker exec app node -e "fetch('http://127.0.0.1:3002/health/status').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              healthy=1; break
            fi
          done
          [ "$started" = 1 ] || fail "never reached 'Starting Nest application' (hung or crashed while loading)"
          [ "$running" = 1 ] || fail "worker for the main task queue never reported RUNNING"
          [ "$healthy" = 1 ] || fail "health endpoint did not return 200"

          docker exec temporal temporal task-queue describe --task-queue main --address temporal:7233 \
            | tee /tmp/tq.txt
          # a real poller row looks like: "UNVERSIONED  workflow  1@<host>  now  100000"
          grep -Eq "(workflow|activity) +[0-9]+@" /tmp/tq.txt \
            || fail "Temporal reports no pollers on the main task queue"
          echo "Boot check passed."

      - name: Show orchestrator logs (always)
        if: always()
        run: docker logs app 2>&1 | tail -n 60 || true

      - name: Login to ghcr
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only reached when the boot check passed (a failed step skips the rest).
      - name: Push verified image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag candidate:ci "$IMAGE:${{ steps.vars.outputs.tag }}"
          docker tag candidate:ci "$IMAGE:main"
          docker push "$IMAGE:${{ steps.vars.outputs.tag }}"
          docker push "$IMAGE:main"
