name: "Build Main Image"

# Builds and pushes this fork's image to ghcr.io/halleshubham/sociobird-app on
# every merge to main, so a merged change is always available as an image.
# Production (Coolify "postiz-v2") pins an explicit tag: to release, point it
# at the sha-<short> tag published here. The manual counterpart for building
# other branches is build-qat-image.yml.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: build-main-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/halleshubham/sociobird-app:${{ steps.vars.outputs.tag }} \
            -t ghcr.io/halleshubham/sociobird-app:main \
            --build-arg NEXT_PUBLIC_VERSION=${{ steps.vars.outputs.tag }} \
            --push .
